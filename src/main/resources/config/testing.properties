# Delta Pharmacy - Testing Environment Configuration
# Environment: Testing (Local Development)
# Last Updated: 2025-01-29

# ============================================
# APPLICATION CONFIGURATION
# ============================================
app.url=http://localhost:3001
app.name=Delta Pharmacy
api.base.url=http://localhost:8545/pharmacy-api/api

# ============================================
# BROWSER CONFIGURATION
# ============================================
browser=chrome
headless=false
maximize.window=true
delete.cookies=true
accept.insecure.certs=true

# ============================================
# TIMEOUT CONFIGURATION (seconds)
# ============================================
implicit.wait=10
explicit.wait=20
page.load.timeout=30
script.timeout=20
polling.interval=500

# ============================================
# USER CREDENTIALS - CUSTOMER
# ============================================
app.username=customer@example.com
app.password=customer123
customer.fullname=John Customer

# ============================================
# USER CREDENTIALS - ADMIN
# ============================================
admin.username=admin@pharmacy.com
admin.password=admin123
admin.fullname=Admin User

# ============================================
# USER CREDENTIALS - PHARMACIST
# ============================================
pharmacist.username=pharmacist@pharmacy.com
pharmacist.password=pharma123
pharmacist.fullname=Pharmacist User

# ============================================
# TEST DATA CONFIGURATION
# ============================================
use.java.faker=true
test.data.file=testdata.xlsx
users.json.file=users.json
products.json.file=products.json

# ============================================
# SCREENSHOT CONFIGURATION
# ============================================
take.screenshot.on.pass=false
take.screenshot.on.failure=true
take.screenshot.on.skip=false
screenshot.format=png

# ============================================
# VIDEO RECORDING CONFIGURATION
# ============================================
enable.video.recording=true
record.failed.tests.only=true
video.format=avi
video.frame.rate=16

# ============================================
# LOGGING CONFIGURATION
# ============================================
enable.logging=true
log.level=INFO
log.file.path=logs/automation.log
console.log.enabled=true

# ============================================
# RETRY CONFIGURATION
# ============================================
max.retry.count=3
retry.interval.ms=1000
element.retry.count=3

# ============================================
# PARALLEL EXECUTION CONFIGURATION
# ============================================
parallel.execution=true
thread.count=3
data.provider.thread.count=2

# ============================================
# REPORTING CONFIGURATION
# ============================================
report.title=Delta Pharmacy Test Automation - Testing Environment
report.name=Test Execution Report
extent.report.theme=dark
allure.results.directory=target/allure-results
report.screenshots.base64=false

# ============================================
# SELENIUM GRID CONFIGURATION
# ============================================
use.selenium.grid=false
selenium.grid.url=http://localhost:4444/wd/hub
grid.browser.version=latest
grid.platform=LINUX

# ============================================
# MOBILE VIEW CONFIGURATION
# ============================================
mobile.view.enabled=false
mobile.device=IPHONE_14_PRO
mobile.width=393
mobile.height=852

# ============================================
# NETWORK CONFIGURATION
# ============================================
network.condition=online
simulate.slow.network=false
network.offline=false
network.download.speed=4096
network.upload.speed=2048
network.latency=20

# ============================================
# LOCALIZATION CONFIGURATION
# ============================================
default.locale=en
supported.locales=en,ar,fr
localization.path=src/main/resources/localization/

# ============================================
# DATABASE CONFIGURATION (if needed)
# ============================================
db.enabled=false
db.url=jdbc:mysql://localhost:3306/pharmacy_db
db.username=root
db.password=root
db.driver=com.mysql.cj.jdbc.Driver

# ============================================
# EMAIL CONFIGURATION (for notifications)
# ============================================
email.notifications.enabled=false
email.smtp.host=smtp.gmail.com
email.smtp.port=587
email.username=automation@pharmacy.com
email.password=
email.recipients=team@pharmacy.com

# ============================================
# CI/CD CONFIGURATION
# ============================================
ci.environment=false
ci.build.number=
ci.build.url=
ci.job.name=

# ============================================
# ADVANCED CONFIGURATION
# ============================================
page.load.strategy=normal
browser.download.directory=downloads/
clear.browser.cache=true
clear.local.storage=true
clear.session.storage=true
enable.browser.logs=true
capture.network.logs=false
capture.console.logs=true

# ============================================
# WAIT STRATEGY CONFIGURATION
# ============================================
default.wait.strategy=explicit
fluent.wait.enabled=true
fluent.wait.polling=500
fluent.wait.timeout=20

# ============================================
# ELEMENT INTERACTION CONFIGURATION
# ============================================
scroll.to.element=true
highlight.element=false
highlight.color=red
highlight.border.width=3
click.with.javascript.fallback=true

# ============================================
# ASSERTION CONFIGURATION
# ============================================
soft.assertions.enabled=false
continue.on.failure=false
assertion.timeout=5

# ============================================
# DATA DRIVEN TESTING
# ============================================
data.driven.enabled=true
excel.sheet.name=TestData
json.pretty.print=true

# ============================================
# PERFORMANCE TESTING
# ============================================
measure.page.load.time=true
measure.test.execution.time=true
performance.threshold.seconds=5

# ============================================
# SECURITY CONFIGURATION
# ============================================
mask.sensitive.data=true
encrypt.passwords=false
ssl.verification=false

# ============================================
# BROWSER SPECIFIC OPTIONS
# ============================================
# Chrome
chrome.disable.extensions=true
chrome.disable.images=false
chrome.disable.notifications=true
chrome.incognito.mode=false

# Firefox
firefox.disable.extensions=true
firefox.private.mode=false

# Edge
edge.disable.extensions=true
edge.inprivate.mode=false

# ============================================
# END OF CONFIGURATION
# ============================================