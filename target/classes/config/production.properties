# production.properties
# Delta Pharmacy - Production Environment Configuration
app.url=https://www.deltapharmacy.com
app.name=Delta Pharmacy - Production
api.base.url=https://api.deltapharmacy.com/pharmacy-api/api

browser=chrome
headless=true
maximize.window=true
delete.cookies=true

implicit.wait=20
explicit.wait=30
page.load.timeout=45

app.username=${PROD_USERNAME}
app.password=${PROD_PASSWORD}
admin.username=${PROD_ADMIN_USERNAME}
admin.password=${PROD_ADMIN_PASSWORD}
pharmacist.username=${PROD_PHARMACIST_USERNAME}
pharmacist.password=${PROD_PHARMACIST_PASSWORD}

take.screenshot.on.failure=true
enable.video.recording=false
enable.logging=true
log.level=WARN

max.retry.count=1
thread.count=1