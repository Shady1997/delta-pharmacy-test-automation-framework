name: Delta Pharmacy Automation Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to Run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - sanity
          - regression
          - e2e
          - all
      browser:
        description: 'Browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge
      environment:
        description: 'Environment'
        required: true
        default: 'testing'
        type: choice
        options:
          - testing
          - staging
          - production

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: -Xmx2048m

jobs:
  test:
    name: Run Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
        include:
          - browser: chrome
            test-suite: smoke
          - browser: firefox
            test-suite: smoke
          - browser: edge
            test-suite: sanity

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Install Dependencies
        run: mvn clean install -DskipTests

      - name: Run ${{ matrix.test-suite }} Tests on ${{ matrix.browser }}
        run: |
          mvn test \
            -DsuiteXmlFile=testng-suites/${{ matrix.test-suite }}-tests.xml \
            -Dbrowser=${{ matrix.browser }} \
            -Denv=${{ github.event.inputs.environment || 'testing' }} \
            -Dheadless=true
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-results-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: target/allure-results
          retention-days: 30

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: extent-report-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: test-output/reports/ExtentReport.html
          retention-days: 30

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: test-output/screenshots/
          retention-days: 15

      - name: Upload Videos
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: videos-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: test-output/videos/
          retention-days: 15

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: logs-${{ matrix.browser }}-${{ matrix.test-suite }}
          path: logs/
          retention-days: 15

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            target/surefire-reports/*.xml
          check_name: Test Results - ${{ matrix.browser }}
          comment_title: Test Results - ${{ matrix.browser }}

  allure-report:
    name: Generate Allure Report
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v3
        with:
          path: allure-results

      - name: Merge Allure Results
        run: |
          mkdir -p target/allure-results
          find allure-results -name '*.json' -exec cp {} target/allure-results/ \;

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          destination_dir: reports/${{ github.run_number }}

  notify:
    name: Send Notifications
    needs: [test, allure-report]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack Notification
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ Delta Pharmacy Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Delta Pharmacy Automation Tests Failed*\n\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*Build URL:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send Email Notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Delta Pharmacy Tests Failed - Build ${{ github.run_number }}
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: GitHub Actions <noreply@github.com>
          body: |
            Test execution failed for Delta Pharmacy Automation.
            
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Check artifacts for screenshots, videos, and logs.